    :root {
      --canvas: #F6F7F9;
      --surface: #FFFFFF;
      --hairline: rgba(15, 23, 42, 0.075);
      --hairline-strong: rgba(15, 23, 42, 0.14);
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-card: 0 0 0 1px rgba(15, 23, 42, 0.055), 0 2px 4px rgba(15, 23, 42, 0.03), 0 12px 28px -8px rgba(15, 23, 42, 0.06);
      --shadow-elevated: 0 0 0 1px rgba(15, 23, 42, 0.07), 0 16px 40px -12px rgba(15, 23, 42, 0.14), 0 4px 12px -2px rgba(15, 23, 42, 0.05);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }

    html, body {
      background-color: var(--canvas);
      background-image:
        radial-gradient(ellipse 90% 40% at 50% -12%, rgba(37, 99, 235, 0.055), transparent 70%),
        radial-gradient(ellipse 50% 30% at 90% 0%, rgba(14, 165, 233, 0.04), transparent 60%);
      background-attachment: fixed;
      color: #0F172A;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-variant-numeric: tabular-nums;
      overflow-x: hidden;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Realistic Apple/Linear-grade surface materiality */
    .pro-card {
      background: #FFFFFF;
      box-shadow: var(--shadow-card);
      border-radius: 18px;
    }

    .pro-card-interactive {
      background: #FFFFFF;
      box-shadow: var(--shadow-card);
      border-radius: 16px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pro-card-interactive:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.10), 0 6px 16px -4px rgba(15, 23, 42, 0.07), 0 20px 36px -12px rgba(15, 23, 42, 0.08);
    }

    .glass-nav {
      background: rgba(246, 247, 249, 0.78);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(15, 23, 42, 0.075);
    }

    .exercise-row {
      transition: background-color 0.14s ease;
    }

    .exercise-row:hover {
      background-color: #F8FAFC;
    }

    @keyframes enterStage {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-stage {
      animation: enterStage 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .live-dot {
      animation: pulseLive 2.6s ease-in-out infinite;
    }

    @keyframes rowFlash {
      0% { background-color: rgba(37, 99, 235, 0.10); }
      100% { background-color: transparent; }
    }
    .flash-row {
      animation: rowFlash 1.8s ease-out;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    const SHORT_LABELS = {
      'beg-full-body': 'Full Body',
      'beg-ppl': 'Push Pull Legs',
      'men-4day': 'Men',
      'women-4day': 'Women',
      'knee-4day': 'Knee Safe',

    };

    const TAG_STYLES = {
      cobalt:  'bg-blue-50/90 text-blue-700 border-blue-200/80',
      emerald: 'bg-emerald-50/90 text-emerald-700 border-emerald-200/80',
      amber:   'bg-amber-50/90 text-amber-700 border-amber-200/80',
      slate:   'bg-slate-100 text-slate-700 border-slate-200/80',
    };

    let state = {
      activeView: 'all',
      pinnedSplits: [],
      activeDays: {},
      exercises: DEFAULT_EXERCISES
    };

    let cmdSelectedIdx = 0;
    let cmdItemsCache = [];
    let pendingHighlightId = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            state.activeDays = parsed.activeDays || {};
            state.pinnedSplits = Array.isArray(parsed.pinnedSplits) ? parsed.pinnedSplits : [];
            if (parsed.activeView) state.activeView = parsed.activeView;
          }
        }
      } catch (e) {
        // Ignore storage errors
      }
      PROGRAM_STRUCTURE.forEach(cat => {
        cat.splits.forEach(split => {
          if (!state.activeDays[split.id] && split.days.length > 0) {
            state.activeDays[split.id] = split.days[0].id;
          }
        });
      });
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          activeDays: state.activeDays,
          pinnedSplits: state.pinnedSplits,
          activeView: state.activeView
        }));
      } catch (e) {
        // Ignore storage errors
      }
    }

    function getTotalExerciseCount() {
      return Object.values(state.exercises).reduce((sum, list) => sum + (Array.isArray(list) ? list.length : 0), 0);
    }

    function getTotalDaysCount() {
      return PROGRAM_STRUCTURE.reduce((sum, cat) => sum + cat.splits.reduce((s, sp) => s + sp.days.length, 0), 0);
    }

    function getSplitExerciseCount(split) {
      return split.days.reduce((sum, day) => sum + (state.exercises[day.id]?.length || 0), 0);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      toastText.textContent = msg;
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 2200);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getAllSplitsFlat() {
      const all = [];
      PROGRAM_STRUCTURE.forEach(cat => {
        cat.splits.forEach(split => {
          all.push({
            id: split.id,
            catId: cat.id,
            catName: cat.name,
            tag: cat.tag || '',
            accent: cat.accent || 'slate',
            description: cat.description || '',
            name: split.name,
            shortName: SHORT_LABELS[split.id] || split.name,
            daysCount: split.days.length,
            daysLabel: split.daysLabel,
            exerciseCount: getSplitExerciseCount(split),
            pinned: state.pinnedSplits.includes(split.id),
            split,
            cat
          });
        });
      });
      return all.sort((a, b) => Number(b.pinned) - Number(a.pinned));
    }

    function getNoteStyle(note) {
      const n = String(note || '').toLowerCase();
      if (n.includes('finisher') || n.includes('fat burn')) {
        return {
          pill: 'bg-amber-50/90 border-amber-200/80 text-amber-800',
          dot: 'bg-amber-500'
        };
      }
      if (n.includes('cardio')) {
        return {
          pill: 'bg-blue-50/90 border-blue-200/80 text-blue-700',
          dot: 'bg-blue-500'
        };
      }
      if (n.includes('core')) {
        return {
          pill: 'bg-emerald-50/90 border-emerald-200/80 text-emerald-700',
          dot: 'bg-emerald-500'
        };
      }
      return {
        pill: 'bg-slate-100 border-slate-200/80 text-secondary',
        dot: 'bg-slate-400'
      };
    }

    function renderMobileNav() {
      const nav = document.getElementById('mobileSplitNav');
      const flatSplits = getAllSplitsFlat();
      const allActive = state.activeView === 'all';

      const allBtn = `
        <button
          type="button"
          data-view-tab="all"
          class="shrink-0 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-[13px] font-semibold transition-all min-h-[38px] ${
            allActive
              ? 'bg-ink text-white shadow-[0_2px_8px_rgba(15,23,42,0.2)]'
              : 'bg-white/90 text-secondary hover:text-ink border border-slate-200/80'
          }"
        >
          <i data-lucide="layout-grid" class="w-3.5 h-3.5 ${allActive ? 'text-blue-400' : 'text-faint'}"></i>
          <span>All</span>
        </button>
      `;

      const splitBtns = flatSplits.map(item => {
        const active = state.activeView === item.id;
        return `
          <button
            type="button"
            data-view-tab="${item.id}"
            class="shrink-0 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-[13px] font-semibold transition-all min-h-[38px] ${
              active
                ? 'bg-ink text-white shadow-[0_2px_8px_rgba(15,23,42,0.2)]'
                : item.pinned
                  ? 'bg-white text-ink border border-blue-300 ring-1 ring-blue-100'
                  : 'bg-white/90 text-secondary hover:text-ink border border-slate-200/80'
            }"
          >
            ${item.pinned ? `<span class="w-1.5 h-1.5 rounded-full ${active ? 'bg-blue-400' : 'bg-cobalt-600'}"></span>` : ''}
            <span>${escapeHtml(item.shortName)}</span>
            <span class="font-mono text-[10px] px-1.5 py-0.5 rounded-md ${active ? 'bg-white/15 text-slate-200' : 'bg-subtle text-muted'}">${item.daysCount}D</span>
          </button>
        `;
      }).join('');

      nav.innerHTML = allBtn + splitBtns;

      const mobileLabel = document.getElementById('mobileActiveLabel');
      if (mobileLabel) {
        const current = flatSplits.find(s => s.id === state.activeView);
        mobileLabel.textContent = current ? current.shortName : 'All Splits';
      }
    }

        const active = state.activeView === item.id;
        return `
          <div class="group relative flex items-center">
            <button
              type="button"
              data-view-tab="${item.id}"
              class="w-full text-left flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl text-[13px] font-medium transition-all ${
                active
                  ? 'bg-white text-ink font-semibold shadow-[0_0_0_1px_rgba(15,23,42,0.08),0_2px_8px_rgba(15,23,42,0.05)]'
                  : 'text-secondary hover:text-ink hover:bg-white/60'
              }"
            >
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="w-1.5 h-1.5 rounded-full shrink-0 ${
                  active ? 'bg-cobalt-600' : item.pinned ? 'bg-blue-400' : 'bg-slate-300 group-hover:bg-slate-400'
                }"></span>
                <span class="truncate">${escapeHtml(item.shortName)}</span>
              </div>
              <span class="font-mono text-[11px] px-1.5 py-0.5 rounded-md shrink-0 ${
                active ? 'bg-ink text-white' : 'bg-slate-200/60 text-muted'
              }">${item.daysCount}D</span>
            </button>
          </div>
        `;
      };

      rail.innerHTML = `
        <div class="space-y-1">
          <button
            type="button"
            data-view-tab="all"
            class="w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl text-[13px] font-medium transition-all ${
              allActive
                ? 'bg-ink text-white font-semibold shadow-[0_2px_10px_rgba(15,23,42,0.18)]'
                : 'text-secondary hover:text-ink hover:bg-white/70'
            }"
          >
            <span class="flex items-center gap-2.5">
              <i data-lucide="layout-grid" class="w-4 h-4 ${allActive ? 'text-blue-400' : 'text-faint'}"></i>
              <span>All Splits</span>
            </span>
            <span class="font-mono text-[11px] px-1.5 py-0.5 rounded-md ${allActive ? 'bg-white/15 text-white' : 'bg-slate-200/70 text-muted'}">${flat.length}</span>
          </button>
        </div>

        ${pinned.length > 0 ? `
          <div class="space-y-1">
            <div class="px-3 text-[11px] font-semibold uppercase tracking-[0.08em] text-faint">Pinned</div>
            ${pinned.map(renderRailItem).join('')}
          </div>
        ` : ''}

        <div class="space-y-1">
          <div class="px-3 text-[11px] font-semibold uppercase tracking-[0.08em] text-faint">${pinned.length > 0 ? 'Programs' : 'Training Splits'}</div>
          ${unpinned.map(renderRailItem).join('')}
        </div>
      `;
    }

    function renderOverviewView() {
      const flat = getAllSplitsFlat();
      return `
        <div class="space-y-6 animate-stage">
          <!-- Clean Editorial Header -->
          <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
            <div>
              <p class="text-[11px] font-semibold uppercase tracking-[0.1em] text-cobalt-600">Program Directory</p>
              <h2 class="font-display font-extrabold text-2xl sm:text-[28px] tracking-[-0.03em] text-ink mt-1">
                Training Splits
              </h2>
              <p class="text-[14px] text-secondary mt-1">
                Select any split or jump directly to a specific training day.
              </p>
            </div>
          </div>

          <!-- Split Overview Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${flat.map(item => {
              const tagCls = TAG_STYLES[item.accent] || TAG_STYLES.slate;
              return `
                <article
                  data-view-tab="${item.id}"
                  class="pro-card-interactive p-5 cursor-pointer flex flex-col justify-between gap-4 group"
                >
                  <div>
                    <div class="flex items-center justify-between gap-2">
                      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full border text-[11px] font-semibold ${tagCls}">
                        ${escapeHtml(item.tag)}
                      </span>
                      <button
                        type="button"
                        data-pin-split="${item.id}"
                        class="p-1.5 rounded-lg border transition-colors ${
                          item.pinned
                            ? 'bg-ink border-ink text-white'
                            : 'bg-white border-slate-200/80 text-faint hover:text-ink hover:border-slate-300'
                        }"
                        title="${item.pinned ? 'Unpin split' : 'Pin split'}"
                        aria-label="${item.pinned ? 'Unpin split' : 'Pin split'}"
                      >
                        <i data-lucide="pin" class="w-3.5 h-3.5 ${item.pinned ? 'text-blue-300' : ''}"></i>
                      </button>
                    </div>

                    <div class="mt-3">
                      <h3 class="font-display font-bold text-[18px] tracking-[-0.02em] text-ink group-hover:text-cobalt-600 transition-colors">
                        ${escapeHtml(item.catName)}
                      </h3>
                      <p class="text-[13px] text-secondary mt-1 leading-relaxed">
                        ${escapeHtml(item.description)}
                      </p>
                    </div>

                    <!-- Direct Day Jump Chips -->
                    <div class="flex flex-wrap gap-1.5 mt-4">
                      ${item.split.days.map((d, dIdx) => `
                        <button
                          type="button"
                          data-jump-split="${item.id}"
                          data-jump-day="${d.id}"
                          class="inline-flex items-center gap-1.5 px-3 py-1.5 min-h-[34px] rounded-lg bg-subtle hover:bg-ink hover:text-white active:scale-[0.98] text-[12px] font-medium text-secondary transition-all"
                          title="Open ${escapeHtml(d.title)}: ${escapeHtml(d.focus)}"
                        >
                          <span class="font-mono text-[10px] opacity-65">D${dIdx + 1}</span>
                          <span class="truncate max-w-[130px]">${escapeHtml(d.focus)}</span>
                        </button>
                      `).join('')}
                    </div>
                  </div>

                  <div class="flex items-center justify-between pt-3.5 border-t border-slate-100">
                    <div class="flex items-center gap-2 text-[12px] font-medium text-muted">
                      <span>${escapeHtml(item.daysLabel)}</span>
                      <span class="text-slate-300">·</span>
                      <span>${item.exerciseCount} exercises</span>
                    </div>
                    <span class="inline-flex items-center gap-1 text-[13px] font-semibold text-ink group-hover:text-cobalt-600 transition-colors">
                      Open <i data-lucide="arrow-right" class="w-3.5 h-3.5 group-hover:translate-x-0.5 transition-transform"></i>
                    </span>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderExerciseRow(ex, idx) {
      const isHighlighted = pendingHighlightId === ex.id;
      const numStr = String(idx + 1).padStart(2, '0');
      const noteStyle = ex.notes ? getNoteStyle(ex.notes) : null;
      const dotColor = noteStyle ? noteStyle.dot : 'bg-slate-300';

      const volumeText = ex.duration
        ? escapeHtml(ex.duration)
        : (ex.sets || ex.reps)
          ? (ex.reps === 'to failure'
              ? `${escapeHtml(ex.sets || '—')} sets · to failure`
              : `${escapeHtml(ex.sets || '—')} × ${escapeHtml(ex.reps || '—')}${(String(ex.reps || '').endsWith('s') || String(ex.reps || '').includes('min')) ? '' : ' reps'}`)
          : '';

      return `
        <div
          id="ex-${escapeHtml(ex.id)}"
          class="exercise-row flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 px-4 sm:px-6 py-4 ${isHighlighted ? 'flash-row' : ''}"
        >
          <div class="flex items-start sm:items-center gap-3.5 min-w-0">
            <span class="font-mono text-[12px] font-semibold text-faint w-6 shrink-0 mt-0.5 sm:mt-0">
              ${numStr}
            </span>
            <span class="w-1.5 h-1.5 rounded-full ${dotColor} shrink-0 mt-2 sm:mt-0"></span>
            <div class="min-w-0">
              <div class="text-[15px] font-semibold text-ink tracking-[-0.01em] leading-snug break-words">
                ${escapeHtml(ex.primary)}
              </div>
              ${ex.alternative ? `
                <div class="flex items-center gap-1.5 mt-1 text-[12.5px] text-muted">
                  <span class="px-1.5 py-0.5 rounded bg-subtle font-mono text-[10px] font-semibold uppercase tracking-wide text-secondary shrink-0">Alt</span>
                  <span class="truncate sm:whitespace-normal">${escapeHtml(ex.alternative)}</span>
                </div>
              ` : ''}
            </div>
          </div>

          ${(volumeText || ex.notes) ? `
            <div class="flex flex-wrap items-center gap-2 pl-[54px] sm:pl-0 shrink-0">
              ${ex.notes ? `
                <span class="inline-flex items-center px-2.5 py-1 rounded-full border text-[11px] font-semibold ${noteStyle.pill}">
                  ${escapeHtml(ex.notes)}
                </span>
              ` : ''}
              ${volumeText ? `
                <span class="inline-flex items-center px-3 py-1 rounded-lg font-mono text-[12px] font-medium ${
                  ex.duration
                    ? 'bg-ink text-white'
                    : 'bg-subtle text-ink border border-slate-200/70'
                }">
                  ${volumeText}
                </span>
              ` : ''}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderFocusedSplitView(splitId) {
      const flat = getAllSplitsFlat();
      const idx = flat.findIndex(s => s.id === splitId);
      if (idx === -1) {
        state.activeView = 'all';
        saveState();
        return renderOverviewView();
      }

      const item = flat[idx];
      const { cat, split } = item;
      const prev = flat[(idx - 1 + flat.length) % flat.length];
      const next = flat[(idx + 1) % flat.length];

      const activeDayId = state.activeDays[split.id] || split.days[0].id;
      const activeDay = split.days.find(d => d.id === activeDayId) || split.days[0];
      const dayExercises = state.exercises[activeDay.id] || [];
      const tagCls = TAG_STYLES[cat.accent] || TAG_STYLES.slate;

      return `
        <div class="space-y-5 animate-stage">
          <!-- Top Breadcrumb & Split Stepper -->
          <div class="flex flex-wrap items-center justify-between gap-2">
            <button
              type="button"
              data-view-tab="all"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white hover:bg-slate-50 border border-slate-200/90 text-[13px] font-medium text-secondary hover:text-ink shadow-[0_1px_2px_rgba(15,23,42,0.03)] transition-all"
            >
              <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
              <span>All Splits</span>
            </button>

            <div class="hidden sm:flex items-center gap-1.5">
              <button
                type="button"
                data-view-tab="${prev.id}"
                class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-white hover:bg-slate-50 border border-slate-200/90 text-[12px] font-medium text-secondary hover:text-ink shadow-[0_1px_2px_rgba(15,23,42,0.03)] transition-all"
                title="Previous: ${escapeHtml(prev.shortName)}"
              >
                <i data-lucide="chevron-left" class="w-3.5 h-3.5 text-faint"></i>
                <span>${escapeHtml(prev.shortName)}</span>
              </button>
              <span class="font-mono text-[11px] text-faint px-1.5">${idx + 1}/${flat.length}</span>
              <button
                type="button"
                data-view-tab="${next.id}"
                class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-white hover:bg-slate-50 border border-slate-200/90 text-[12px] font-medium text-secondary hover:text-ink shadow-[0_1px_2px_rgba(15,23,42,0.03)] transition-all"
                title="Next: ${escapeHtml(next.shortName)}"
              >
                <span>${escapeHtml(next.shortName)}</span>
                <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-faint"></i>
              </button>
            </div>
          </div>

          <!-- Split Header Card -->
          <section class="pro-card overflow-hidden">
            <div class="px-5 sm:px-6 py-5 border-b border-slate-100 flex flex-wrap items-start justify-between gap-4">
              <div class="min-w-0">
                <div class="flex items-center gap-2.5 flex-wrap">
                  <span class="inline-flex items-center px-2.5 py-0.5 rounded-full border text-[11px] font-semibold ${tagCls}">
                    ${escapeHtml(cat.tag || cat.name)}
                  </span>
                  <span class="text-[12px] font-medium text-muted">
                    ${escapeHtml(split.daysLabel)} · ${item.exerciseCount} exercises total
                  </span>
                </div>
                <h2 class="font-display font-extrabold text-xl sm:text-2xl tracking-[-0.025em] text-ink mt-2">
                  ${escapeHtml(split.name)}
                </h2>
                ${cat.description ? `<p class="text-[13.5px] text-secondary mt-1">${escapeHtml(cat.description)}</p>` : ''}
              </div>

              <button
                type="button"
                data-pin-split="${split.id}"
                class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl border text-[13px] font-semibold transition-all min-h-[38px] ${
                  item.pinned
                    ? 'bg-ink border-ink text-white shadow-[0_2px_8px_rgba(15,23,42,0.18)]'
                    : 'bg-white border-slate-200 text-secondary hover:text-ink hover:border-slate-300'
                }"
                title="Pin to front for quick floor access"
              >
                <i data-lucide="pin" class="w-3.5 h-3.5 ${item.pinned ? 'text-blue-400' : ''}"></i>
                <span>${item.pinned ? 'Pinned' : 'Pin Split'}</span>
              </button>
            </div>

            <!-- Day Switcher Bar -->
            <div class="px-4 sm:px-6 py-3.5 bg-slate-50/70 border-b border-slate-100 flex items-stretch gap-2 overflow-x-auto no-scrollbar snap-x snap-mandatory">
              ${split.days.map((day, dIdx) => {
                const isSelected = day.id === activeDay.id;
                const count = (state.exercises[day.id] || []).length;
                const dayNum = String(dIdx + 1).padStart(2, '0');
                return `
                  <button
                    type="button"
                    data-split-id="${split.id}"
                    data-day-id="${day.id}"
                    class="flex-1 min-w-[138px] sm:min-w-0 text-left px-3.5 py-2.5 rounded-xl transition-all ${
                      isSelected
                        ? 'bg-ink text-white shadow-[0_4px_14px_-2px_rgba(15,23,42,0.28)]'
                        : 'bg-white/90 hover:bg-white border border-slate-200/80 hover:border-slate-300 text-ink'
                    }"
                  >
                    <div class="flex items-center justify-between gap-2">
                      <span class="font-mono text-[10px] font-semibold uppercase tracking-[0.08em] ${isSelected ? 'text-blue-300' : 'text-faint'}">
                        Day ${dayNum}
                      </span>
                      <span class="font-mono text-[10px] font-semibold px-1.5 py-0.5 rounded-md ${
                        isSelected ? 'bg-white/15 text-white' : 'bg-subtle text-muted'
                      }">${count}</span>
                    </div>
                    <div class="text-[13px] font-semibold truncate mt-0.5 ${isSelected ? 'text-white' : 'text-ink'}">
                      ${escapeHtml(day.focus)}
                    </div>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Active Session Header -->
            <div class="px-4 sm:px-6 py-3.5 bg-white border-b border-slate-100 flex items-center justify-between gap-3">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="px-2 py-0.5 rounded-md bg-subtle font-mono text-[11px] font-semibold text-ink shrink-0">
                  ${escapeHtml(activeDay.title)}
                </span>
                <h3 class="font-display font-bold text-[15px] sm:text-[16px] text-ink truncate">
                  ${escapeHtml(activeDay.focus)}
                </h3>
              </div>
              <span class="text-[12px] font-medium text-muted shrink-0">
                ${dayExercises.length} ${dayExercises.length === 1 ? 'exercise' : 'exercises'}
              </span>
            </div>

            <!-- Precision Exercise List -->
            <div class="divide-y divide-slate-100">
              ${dayExercises.map((ex, eIdx) => renderExerciseRow(ex, eIdx)).join('')}
            </div>
          </section>
        </div>
      `;
    }

    function renderMainStage() {
      const stage = document.getElementById('mainStage');
      if (state.activeView === 'all') {
        stage.innerHTML = renderOverviewView();
      } else {
        stage.innerHTML = renderFocusedSplitView(state.activeView);
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }

      if (pendingHighlightId) {
        const targetEl = document.getElementById('ex-' + pendingHighlightId);
        if (targetEl) {
          setTimeout(() => {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 80);
        }
        pendingHighlightId = null;
      }
    }

    function renderAll() {
      renderMobileNav();
      renderDesktopRail();
      renderMainStage();
    }

    // Command Palette Logic
    function buildCmdItems(query) {
      const q = (query || '').trim().toLowerCase();
      const items = [];

      items.push({
        type: 'view',
        id: 'all',
        title: 'All Splits Overview',
        subtitle: 'Program directory & quick day matrix',
        badge: 'OVERVIEW',
        action: () => { state.activeView = 'all'; }
      });

      PROGRAM_STRUCTURE.forEach(cat => {
        cat.splits.forEach(split => {
          items.push({
            type: 'split',
            id: split.id,
            title: `${cat.name} — ${split.name}`,
            subtitle: `${split.daysLabel} · ${getSplitExerciseCount(split)} exercises`,
            badge: 'SPLIT',
            action: () => { state.activeView = split.id; }
          });

          split.days.forEach(day => {
            items.push({
              type: 'day',
              id: `${split.id}:${day.id}`,
              title: `${SHORT_LABELS[split.id] || cat.name} · ${day.title}: ${day.focus}`,
              subtitle: `${(state.exercises[day.id] || []).length} exercises`,
              badge: 'DAY',
              action: () => {
                state.activeView = split.id;
                state.activeDays[split.id] = day.id;
              }
            });

            if (q.length >= 2) {
              (state.exercises[day.id] || []).forEach(ex => {
                items.push({
                  type: 'exercise',
                  id: ex.id,
                  title: ex.primary,
                  subtitle: `${SHORT_LABELS[split.id] || cat.name} · ${day.title} (${day.focus})${ex.alternative ? ' · Alt: ' + ex.alternative : ''}`,
                  badge: 'EXERCISE',
                  action: () => {
                    state.activeView = split.id;
                    state.activeDays[split.id] = day.id;
                    pendingHighlightId = ex.id;
                  }
                });
              });
            }
          });
        });
      });

      if (!q) {
        return items.filter(it => it.type === 'view' || it.type === 'split');
      }

      return items.filter(it =>
        it.title.toLowerCase().includes(q) || it.subtitle.toLowerCase().includes(q)
      ).slice(0, 18);
    }

    function renderCmdResults() {
      const input = document.getElementById('cmdInput');
      const container = document.getElementById('cmdResults');
      cmdItemsCache = buildCmdItems(input.value);
      if (cmdSelectedIdx >= cmdItemsCache.length) cmdSelectedIdx = 0;

      if (cmdItemsCache.length === 0) {
        container.innerHTML = `
          <div class="py-10 text-center text-[13px] text-muted">
            No matching splits, days, or exercises found.
          </div>
        `;
        return;
      }

      container.innerHTML = cmdItemsCache.map((item, idx) => {
        const selected = idx === cmdSelectedIdx;
        return `
          <button
            type="button"
            data-cmd-idx="${idx}"
            class="w-full text-left px-3.5 py-2.5 rounded-xl flex items-center justify-between gap-3 transition-colors ${
              selected ? 'bg-ink text-white' : 'hover:bg-subtle text-ink'
            }"
          >
            <div class="min-w-0">
              <div class="text-[13.5px] font-semibold truncate">${escapeHtml(item.title)}</div>
              <div class="text-[12px] truncate ${selected ? 'text-slate-300' : 'text-muted'}">${escapeHtml(item.subtitle)}</div>
            </div>
            <span class="shrink-0 font-mono text-[10px] font-semibold px-2 py-0.5 rounded-md ${
              selected ? 'bg-white/15 text-blue-300' : 'bg-subtle text-muted'
            }">${item.badge}</span>
          </button>
        `;
      }).join('');
    }

    function openCmdModal() {
      const modal = document.getElementById('cmdModal');
      const input = document.getElementById('cmdInput');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      input.value = '';
      cmdSelectedIdx = 0;
      renderCmdResults();
      setTimeout(() => input.focus(), 20);
    }

    function closeCmdModal() {
      const modal = document.getElementById('cmdModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function executeCmdItem(idx) {
      const item = cmdItemsCache[idx];
      if (!item) return;
      item.action();
      saveState();
      closeCmdModal();
      renderAll();
      if (!pendingHighlightId) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function cycleSplit(direction) {
      const flat = getAllSplitsFlat();
      if (state.activeView === 'all') {
        state.activeView = direction > 0 ? flat[0].id : flat[flat.length - 1].id;
      } else {
        const idx = flat.findIndex(s => s.id === state.activeView);
        const nextIdx = (idx + direction + flat.length) % flat.length;
        state.activeView = flat[nextIdx].id;
      }
      saveState();
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Event Delegation
    document.addEventListener('click', (e) => {
      const cmdItemBtn = e.target.closest('[data-cmd-idx]');
      if (cmdItemBtn) {
        executeCmdItem(Number(cmdItemBtn.dataset.cmdIdx));
        return;
      }

      const pinBtn = e.target.closest('[data-pin-split]');
      if (pinBtn) {
        e.stopPropagation();
        const sid = pinBtn.dataset.pinSplit;
        if (state.pinnedSplits.includes(sid)) {
          state.pinnedSplits = state.pinnedSplits.filter(x => x !== sid);
          showToast('Unpinned from front');
        } else {
          state.pinnedSplits.push(sid);
          showToast('Pinned to front');
        }
        saveState();
        renderAll();
        return;
      }

      const jumpDayBtn = e.target.closest('[data-jump-day]');
      if (jumpDayBtn) {
        e.stopPropagation();
        const sid = jumpDayBtn.dataset.jumpSplit;
        const did = jumpDayBtn.dataset.jumpDay;
        state.activeView = sid;
        state.activeDays[sid] = did;
        saveState();
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const viewBtn = e.target.closest('[data-view-tab]');
      if (viewBtn) {
        state.activeView = viewBtn.dataset.viewTab;
        saveState();
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const dayBtn = e.target.closest('[data-day-id]');
      if (dayBtn) {
        const splitId = dayBtn.dataset.splitId;
        const dayId = dayBtn.dataset.dayId;
        state.activeDays[splitId] = dayId;
        saveState();
        renderAll();
        return;
      }

      if (e.target.id === 'cmdModal') {
        closeCmdModal();
      }
    });

    document.getElementById('openCmdBtn').addEventListener('click', openCmdModal);
    document.getElementById('mobileJumpBtn').addEventListener('click', openCmdModal);
    document.getElementById('mobilePrevBtn').addEventListener('click', () => cycleSplit(-1));
    document.getElementById('mobileNextBtn').addEventListener('click', () => cycleSplit(1));
    document.getElementById('closeCmdBtn').addEventListener('click', closeCmdModal);
    document.getElementById('cmdInput').addEventListener('input', () => {
      cmdSelectedIdx = 0;
      renderCmdResults();
    });

    document.addEventListener('keydown', (e) => {
      const modal = document.getElementById('cmdModal');
      const isModalOpen = !modal.classList.contains('hidden');

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (isModalOpen) closeCmdModal();
        else openCmdModal();
        return;
      }

      if (isModalOpen) {
        if (e.key === 'Escape') {
          e.preventDefault();
          closeCmdModal();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (cmdItemsCache.length > 0) {
            cmdSelectedIdx = (cmdSelectedIdx + 1) % cmdItemsCache.length;
            renderCmdResults();
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (cmdItemsCache.length > 0) {
            cmdSelectedIdx = (cmdSelectedIdx - 1 + cmdItemsCache.length) % cmdItemsCache.length;
            renderCmdResults();
          }
        } else if (e.key === 'Enter') {
          e.preventDefault();
          executeCmdItem(cmdSelectedIdx);
        }
      }
    });

    // Init
    loadState();
    renderAll();
  </script>
</body>
</html>

      'fl-3d-1': [

        { id: 'fl1-2', primary: 'Lat Pulldown', alternative: 'Neutral Grip Lat Pulldown', sets: '3', reps: '12-15', notes: '' },

      ],

        { id: 'fl2-2', primary: 'Seated Leg Curl', alternative: 'Leg Extensions', sets: '3', reps: '12-15', notes: '' },
        { id: 'fl2-3', primary: 'Lying Knee Raises', alternative: 'Leg Raises', sets: '3', reps: '15', notes: 'Core' },

      ],

      // Me: Personal 6-Day Split
      'me-6d-1': [

        { id: 'me1-2', primary: 'Barbell Bent-Over Rows', alternative: '', sets: '3', reps: '6–8', notes: '' },
        { id: 'me1-3', primary: 'T-Bar Rows', alternative: '', sets: '3', reps: '8–10', notes: '' },
        { id: 'me1-4', primary: 'Seated Cable Rows', alternative: '', sets: '3', reps: '10–12', notes: '' }
      ],
      'me-6d-2': [
        { id: 'me2-1', primary: 'Flat Barbell Bench Press', alternative: '', sets: '3', reps: '4–6', notes: '' },
        { id: 'me2-2', primary: 'Incline Barbell Bench Press', alternative: '', sets: '3', reps: '6–8', notes: '' },
        { id: 'me2-3', primary: 'Cable Flies', alternative: '', sets: '3', reps: '12–15', notes: '' },
        { id: 'me2-4', primary: 'Side Lateral Raises', alternative: '', sets: '3', reps: '12–15', notes: '' }
      ],
      'me-6d-3': [
        { id: 'me3-1', primary: 'Barbell Military Press', alternative: '', sets: '3', reps: '5–7', notes: '' },
        { id: 'me3-2', primary: 'Side Lateral Raises', alternative: '', sets: '3', reps: '12–15', notes: '' },
        { id: 'me3-3', primary: 'Rear Delt Flies', alternative: '', sets: '3', reps: '12–15', notes: '' },
        { id: 'me3-4', primary: 'Barbell Shrugs', alternative: '', sets: '3', reps: '10–12', notes: '' }
      ],
      'me-6d-4': [
        { id: 'me4-1', primary: 'Weighted Dips', alternative: '', sets: '4', reps: '6–8', notes: '' },
        { id: 'me4-2', primary: 'Barbell Skull Crushers', alternative: '', sets: '4', reps: '8–12', notes: '' },
        { id: 'me4-3', primary: 'Barbell Curls', alternative: '', sets: '2', reps: '8–10', notes: '' },
        { id: 'me4-4', primary: 'Incline Dumbbell Curls', alternative: '', sets: '2', reps: '10–12', notes: '' }
      ],
      'me-6d-5': [
        { id: 'me5-1', primary: 'Barbell Squats', alternative: '', sets: '3', reps: '5–7', notes: '' },
        { id: 'me5-2', primary: 'Leg Extensions', alternative: '', sets: '3', reps: '10–15', notes: '' },
        { id: 'me5-3', primary: 'Leg Curls', alternative: '', sets: '3', reps: '10–15', notes: '' },
        { id: 'me5-4', primary: 'Calf Raises', alternative: '', sets: '3', reps: '12–15', notes: '' }
      ],
      'me-6d-6': [
        { id: 'me6-1', primary: 'Sit-Ups', alternative: '', sets: '3', reps: 'to failure', notes: '' },
        { id: 'me6-2', primary: 'Hanging Knee Raises', alternative: "Captain's Chair Knee Raises", sets: '3', reps: 'to failure', notes: '' },
        { id: 'me6-3', primary: 'Boxing', alternative: '', sets: '3', reps: 'to failure', notes: '' },
        { id: 'me6-4', primary: 'Tyre Throws', alternative: '', sets: '3', reps: 'to failure', notes: '' }
      ]
    };

    let state = {
      activeView: 'all',  // 'all' or split.id for instant 1-tap floor switching
      pinnedSplits: [],   // [splitId] pinned for active floor sessions
      activeDays: {},     // { [splitId]: dayId }
      exercises: DEFAULT_EXERCISES
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            state.activeDays = parsed.activeDays || {};
            state.pinnedSplits = Array.isArray(parsed.pinnedSplits) ? parsed.pinnedSplits : [];
            if (parsed.activeView) state.activeView = parsed.activeView;
          }
        }
      } catch (e) {
        // Ignore storage errors
      }
      PROGRAM_STRUCTURE.forEach(cat => {
        cat.splits.forEach(split => {
          if (!state.activeDays[split.id] && split.days.length > 0) {
            state.activeDays[split.id] = split.days[0].id;
          }
        });
      });
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          activeDays: state.activeDays,
          pinnedSplits: state.pinnedSplits,
          activeView: state.activeView
        }));
      } catch (e) {
        // Ignore storage errors
      }
    }

    function getTotalExerciseCount() {
      return Object.values(state.exercises).reduce((sum, list) => sum + (Array.isArray(list) ? list.length : 0), 0);
    }

    function getSplitExerciseCount(split) {
      return split.days.reduce((sum, day) => sum + (state.exercises[day.id]?.length || 0), 0);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      toastText.textContent = msg;
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 2200);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getAllSplitsFlat() {
      const shortLabels = {
        'beg-full-body': 'Full Body · 3-Day',
        'beg-ppl': 'PPL · 3-Day',
        'men-4day': 'Men · 4-Day',
        'women-4day': 'Women · 4-Day',
        'knee-4day': 'Knee · 4-Day',
        'fat-loss-3day': 'Fat Loss · 3-Day',
        'me-6day': 'Me · 6-Day'
      };
      const all = [];
      PROGRAM_STRUCTURE.forEach(cat => {
        cat.splits.forEach(split => {
          all.push({
            id: split.id,
            shortName: shortLabels[split.id] || split.name,
            pinned: state.pinnedSplits.includes(split.id)
          });
        });
      });
      return all.sort((a, b) => Number(b.pinned) - Number(a.pinned));
    }

    function renderNav() {
      const nav = document.getElementById('categoryNav');
      const flatSplits = getAllSplitsFlat();
      const allActive = state.activeView === 'all';

      const allBtn = `
        <button
          type="button"
          data-view-tab="all"
          class="shrink-0 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all min-h-[40px] ${
            allActive
              ? 'bg-ink text-white shadow-soft'
              : 'bg-surface text-muted hover:text-ink hover:bg-slate-200/70 border border-line'
          }"
        >
          All Splits
        </button>
      `;

      const splitBtns = flatSplits.map(item => {
        const active = state.activeView === item.id;
        return `
          <button
            type="button"
            data-view-tab="${item.id}"
            class="shrink-0 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all min-h-[40px] ${
              active
                ? 'bg-neutral-950 text-white shadow-soft'
                : item.pinned
                  ? 'bg-white text-neutral-950 border-2 border-neutral-950 hover:bg-neutral-100'
                  : 'bg-white text-neutral-800 hover:bg-neutral-100 border border-neutral-200'
            }"
          >
            ${item.pinned ? `<span class="w-1.5 h-1.5 rounded-full ${active ? 'bg-white' : 'bg-neutral-950'}"></span>` : ''}
            <span>${escapeHtml(item.shortName)}</span>
          </button>
        `;
      }).join('');

      nav.innerHTML = allBtn + splitBtns;
    }



    function renderCategories() {

      const container = document.getElementById('categoriesContainer');
      const visibleCategories = state.activeView === 'all'
        ? PROGRAM_STRUCTURE
        : PROGRAM_STRUCTURE
            .map(c => ({ ...c, splits: c.splits.filter(s => s.id === state.activeView) }))
            .filter(c => c.splits.length > 0);

      container.innerHTML = visibleCategories.map(cat => {
        const splitsHtml = cat.splits.map(split => {
          const activeDayId = state.activeDays[split.id] || split.days[0].id;
          const activeDay = split.days.find(d => d.id === activeDayId) || split.days[0];
          const dayExercises = state.exercises[activeDay.id] || [];
          const splitTotal = getSplitExerciseCount(split);

          const dayTabsHtml = split.days.map(day => {
            const isSelected = day.id === activeDay.id;
            const count = (state.exercises[day.id] || []).length;
            return `
              <button
                type="button"
                data-split-id="${split.id}"
                data-day-id="${day.id}"
                class="flex-1 min-w-[116px] sm:min-w-0 text-left px-3.5 py-2.5 rounded-xl border transition-all ${
                  isSelected
                    ? 'bg-neutral-950 text-white border-neutral-950 shadow-[0_8px_20px_-6px_rgba(0,0,0,0.32)]'
                    : 'bg-neutral-50 border-neutral-200 hover:bg-white hover:border-neutral-400 text-ink'
                }"
              >
                <div class="flex items-center justify-between gap-1.5">
                  <span class="font-mono text-[10px] font-bold uppercase tracking-[0.12em] ${isSelected ? 'text-neutral-300' : 'text-neutral-500'}">
                    ${escapeHtml(day.title)}
                  </span>
                  <span class="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded-md ${
                    isSelected ? 'bg-white text-neutral-950' : 'bg-neutral-200 text-neutral-800'
                  }">${count}</span>
                </div>
                <div class="font-display text-xs sm:text-sm font-bold truncate mt-0.5 ${isSelected ? 'text-white' : 'text-neutral-950'}">
                  ${escapeHtml(day.focus)}
                </div>
              </button>
            `;
          }).join('');

          const exercisesListHtml = `
              <div class="space-y-2.5">
                ${dayExercises.map((ex, idx) => `
                  <div class="flex items-start gap-3.5 p-3.5 sm:p-4 rounded-xl border border-neutral-200/90 bg-white hover:border-neutral-900 hover:-translate-y-[1px] transition-all duration-150 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.04)]">
                    <span class="w-7 h-7 rounded-lg bg-neutral-950 text-white font-mono text-[11px] font-bold flex items-center justify-center shrink-0 mt-0.5">
                      0${idx + 1}
                    </span>
                    <div class="min-w-0">
                      <div class="text-sm sm:text-[15px] font-bold text-neutral-950 tracking-[-0.01em] break-words leading-snug">
                        <span>${escapeHtml(ex.primary)}</span>${ex.alternative ? `<span class="text-neutral-400 font-mono font-semibold mx-1.5">/</span><span>${escapeHtml(ex.alternative)}</span>` : ''}
                      </div>
                      ${(ex.duration || ex.sets || ex.reps || ex.notes) ? `
                        <div class="flex flex-wrap items-center gap-2 mt-1.5">
                          ${ex.duration ? `
                            <span class="inline-flex items-center px-2 py-0.5 rounded-md bg-neutral-950 text-white font-mono text-[11px] font-semibold">
                              ${escapeHtml(ex.duration)}
                            </span>
                          ` : (ex.sets || ex.reps) ? `
                            <span class="inline-flex items-center px-2 py-0.5 rounded-md bg-neutral-100 border border-neutral-200 text-neutral-800 font-mono text-[11px] font-semibold">
                              ${ex.reps === 'to failure' ? `${escapeHtml(ex.sets || '—')} sets to failure` : `${escapeHtml(ex.sets || '—')} sets × ${escapeHtml(ex.reps || '—')}${(String(ex.reps || '').endsWith('s') || String(ex.reps || '').includes('min')) ? '' : ' reps'}`}
                            </span>
                          ` : ''}
                          ${ex.notes ? `
                            <span class="text-xs text-muted">${escapeHtml(ex.notes)}</span>
                          ` : ''}
                        </div>
                      ` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            `;

          return `
            <article class="bg-white/90 backdrop-blur-md border border-neutral-200/90 rounded-2xl shadow-[0_14px_38px_-14px_rgba(0,0,0,0.10),0_2px_8px_-2px_rgba(0,0,0,0.04)] overflow-hidden">
              <!-- Split Header -->
              <div class="px-4 sm:px-6 py-4 border-b border-line flex flex-wrap items-center justify-between gap-2 bg-white">
                <div>
                  <h4 class="font-display font-bold text-base sm:text-lg text-ink">${escapeHtml(split.name)}</h4>
                  <p class="text-xs text-muted mt-0.5">${escapeHtml(split.daysLabel)} · ${splitTotal} ${splitTotal === 1 ? 'exercise' : 'exercises'}</p>
                </div>
                <button
                  type="button"
                  data-pin-split="${split.id}"
                  class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl border text-xs font-semibold transition-colors min-h-[38px] ${
                    state.pinnedSplits.includes(split.id)
                      ? 'bg-neutral-950 border-neutral-950 text-white hover:bg-neutral-800'
                      : 'bg-white border-neutral-200 text-neutral-700 hover:text-neutral-950 hover:border-neutral-400'
                  }"
                  title="Pin to front of top bar for active floor coaching"
                >
                  <i data-lucide="pin" class="w-3.5 h-3.5"></i>
                  <span>${state.pinnedSplits.includes(split.id) ? 'Pinned' : 'Pin'}</span>
                </button>
              </div>

              <!-- Day Selector Strip -->
              <div class="px-4 sm:px-6 pt-4 pb-2 flex items-stretch gap-2 overflow-x-auto no-scrollbar">
                ${dayTabsHtml}
              </div>

              <!-- Active Day Body -->
              <div class="p-4 sm:p-6 pt-3">
                <div class="flex items-center justify-between mb-3">
                  <div class="flex items-center gap-2">
                    <span class="font-mono text-xs font-bold uppercase tracking-wider text-neutral-950">${escapeHtml(activeDay.title)}</span>
                    <span class="text-slate-300">·</span>
                    <span class="text-sm font-semibold text-ink">${escapeHtml(activeDay.focus)}</span>
                  </div>
                  <span class="text-xs font-medium text-muted">${dayExercises.length} ${dayExercises.length === 1 ? 'exercise' : 'exercises'}</span>
                </div>
                ${exercisesListHtml}
              </div>
            </article>
          `;
        }).join('');

        return `
          <section class="space-y-3.5" aria-labelledby="cat-${cat.id}">
            <div class="flex items-end justify-between gap-3 px-1">
              <div>
                <div class="flex items-center gap-2">
                  <h3 id="cat-${cat.id}" class="font-display font-extrabold text-lg sm:text-xl text-ink tracking-tight">
                    ${escapeHtml(cat.name)}
                  </h3>
                </div>
              </div>
            </div>
            <div class="space-y-5">
              ${splitsHtml}
            </div>
          </section>
        `;
      }).join('');

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    function renderAll() {
      renderNav();
      renderCategories();
    }

    document.addEventListener('click', (e) => {
      const viewBtn = e.target.closest('[data-view-tab]');
      if (viewBtn) {
        state.activeView = viewBtn.dataset.viewTab;
        saveState();
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const pinBtn = e.target.closest('[data-pin-split]');
      if (pinBtn) {
        const sid = pinBtn.dataset.pinSplit;
        if (state.pinnedSplits.includes(sid)) {
          state.pinnedSplits = state.pinnedSplits.filter(x => x !== sid);
          showToast('Unpinned from front');
        } else {
          state.pinnedSplits.push(sid);
          showToast('Pinned to front');
        }
        saveState();
        renderAll();
        return;
      }

      const dayBtn = e.target.closest('[data-day-id]');
      if (dayBtn) {
        const splitId = dayBtn.dataset.splitId;
        const dayId = dayBtn.dataset.dayId;
        state.activeDays[splitId] = dayId;
        saveState();
        renderAll();
      }
    });

    // Init
    loadState();
    renderAll();
  </script>
